<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Call &amp; Rent — إدارة التشغيل</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1b2a56" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Call & Rent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/logo-mark.svg" alt="" width="36" height="36" />
        <div>
          <span class="name">CALL &amp; RENT</span>
          <small>إدارة عمليات التشغيل — إسطنبول</small>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="status-pill" class="pill">…</span>
        <button id="refresh-btn" class="btn ghost" type="button">تحديث</button>
        <button id="token-btn" class="btn ghost" type="button">رمز الدخول</button>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="today">لوحة اليوم</button>
      <button class="tab" data-view="assistant">محادثتنا</button>
      <button class="tab" data-view="contracts">العقود</button>
      <button class="tab" data-view="fleet">الأسطول</button>
      <button class="tab" data-view="accounting">محاسبة المستأجرين</button>
      <button class="tab" data-view="inbox">واتساب</button>
      <button class="tab" data-view="templates">الردود المدرَّبة</button>
      <button class="tab" data-view="audit">سجل الأوامر</button>
      <button class="tab" data-view="settings">الإعدادات</button>
    </nav>

    <main id="app"><div class="empty">جارِ التحميل…</div></main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
